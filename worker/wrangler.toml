name = "dopagaki-concierge"
main = "src/index.ts"
compatibility_date = "2026-11-27"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
# Only these sites may call the Worker (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://darkhos.github.io,http://localhost:5173,http://localhost:5181,http://localhost:4179,http://127.0.0.1:4182"
AGENT_MODEL = "claude-sonnet-5-5"
AGENT_EFFORT = "low"
AGENT_DAILY_LIMIT = "1000"
AGENT_USER_DAILY_LIMIT = "200"
AGENT_IP_DAILY_LIMIT = "150"
AGENT_IP_BURST_LIMIT = "12"
WEB_FX_URL = "https://darkhos.github.io/dopagaki/naver-fx.json"
WEB_PRICES_URL = "https://darkhos.github.io/dopagaki/prices.json"

# SQLite-backed Durable Object for atomic rate limiting & strongly consistent thread storage
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "AgentCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentCoordinator"]

# Legacy KV namespace kept as fallback
[[kv_namespaces]]
binding = "USAGE"
id = "fc95a670cd6c40e4a7331c3f0aa62978"

name = "dopagaki-concierge"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Only these sites may call the Worker (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://darkhos.github.io,http://localhost:5173,http://localhost:5181"
DAILY_LIMIT = "500"

# Optional daily cap. Create the namespace, then uncomment and paste its id:
#   npx wrangler kv namespace create USAGE
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<paste id here>"
